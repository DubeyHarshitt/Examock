<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Examock — Prepare smarter for your competitive exam">
  <defs>
    <linearGradient id="emk-badge-og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4538d6"/>
    </linearGradient>
    <linearGradient id="emk-og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f7f8fb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#emk-og-bg)"/>
  <!-- emblem -->
  <g transform="translate(508 46) scale(0.359375)">
    <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#emk-badge-og)"/>
    <g transform="translate(-4 -16)" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
