    <tspan fill="#1a1f2e">Exam</tspan><tspan fill="#4538d6">ock</tspan>
  </text>
  <!-- tagline -->
  <text x="600" y="492" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="0.5" fill="#667085">
